# specmesh per-repo config -- auto-generated by 'specmesh: Scaffold Spec-Driven Development Structure'.
# Edit freely: add/remove doc types, or add an 'exclude' list to any entry. See specmesh's README for the schema.
#
# Nest a doc type under another in the tree with 'children': a matched instance nests under the parent
# instance sharing its directory + version (e.g. plan.v2.md nests under spec.v2.md in the same
# docs/FR-*/ folder) instead of listing under its own top-level category. Example:
#   - type: fr-spec
#     glob: "docs/FR-*/spec.v*.md"
#     children:
#       - type: fr-plan
#         glob: "docs/FR-*/plan.v*.md"
#
# Declare child repos to auto-clone/sync them ('specmesh: Sync/Clone Repos'), and mirror this repo's own
# central .specmesh/spec.git remote so a fresh machine can bootstrap everything in one go. Example:
#   specRepoRemote: git@github.com:acme/product-specs.git
#   repos:
#     - name: product-api
#       remote: git@github.com:acme/product-api.git
#       path: ../product-api   # relative to this file; cloned here if missing
track:
  - type: charter
    label: Charter
    glob: docs/charter.md
    root: true
  - type: epic
    label: Epics
    glob: docs/epics/EPIC-*.md
    root: true
  - type: fr-spec
    label: FR Specs
    glob: docs/FR-*/spec.v*.md
    children:
      - type: fr-plan
        label: FR Plans
        glob: docs/FR-*/plan.v*.md
        root: true
      - type: fr-tasks
        label: FR Tasks
        glob: docs/FR-*/tasks.v*.md
        root: true
      - type: fr-walkthrough
        label: FR Walkthroughs
        glob: docs/FR-*/walkthrough.v*.md
        root: true
  - type: adr
    label: ADRs
    glob: docs/adr/ADR-*.md
    root: true
  - type: reference
    label: Reference
    glob: docs/reference/*.md
  - type: instructions
    label: Instructions
    glob: .github/instructions/*.instructions.md
    root: true
  - type: skill
    label: Skills
    glob: .github/skills/*/SKILL.md
    root: true
  - type: sdd
    label: Spec-Driven Development
    glob: docs/spec-driven-development.md
    root: true
